name: payment_reminder_app
description: Payment Reminder System mobile client (Flutter MVP)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  go_router: ^14.6.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.0
  sqflite_sqlcipher: ^3.2.0
  path: ^1.9.0
  path_provider: ^2.1.5
  device_info_plus: ^11.2.0
  crypto: ^3.0.3
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  another_telephony: ^0.4.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

# Local patched copy of sqflite_sqlcipher 3.2.0. Upstream's android/build.gradle
# references `flutter.compileSdkVersion`, which fails to resolve in plugin
# sub-projects under newer Flutter (3.16+). The fork pins a literal compileSdk.
# Drop this override once we move to Dart SDK 3.9+ and bump to sqflite_sqlcipher
# 3.4.0+, which fixes the issue upstream.
dependency_overrides:
  sqflite_sqlcipher:
    path: third_party/sqflite_sqlcipher_patched

flutter:
  uses-material-design: true
