org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Disable Kotlin incremental compilation. Workaround for a Kotlin compiler bug
# triggered when the project (D:\) and the pub cache (C:\) live on different
# drive roots — the relocatable cache fails to compute relative paths and
# poisons the build with cryptic "Could not close incremental caches" errors.
# Has no impact on output, only on rebuild speed.
kotlin.incremental=false
